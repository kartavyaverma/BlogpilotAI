services:
  - type: web
    name: blogpilot-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd src && uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: LLM_PROVIDER
        value: moonshot
      - key: MOONSHOT_MODEL
        value: kimi-k2.6
      - key: LLM_MAX_TOKENS
        value: 8000
      # Set this one in the Render dashboard: Environment -> Add Environment Variable
      - key: MOONSHOT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Still used for generating diagrams, even when Kimi K2 writes the article.
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

